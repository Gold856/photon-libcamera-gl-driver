name: Build driver

on:
  push:
  pull_request:
    branches: ["master"]

jobs:
  validation:
    name: "Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v5

  build:
    runs-on: ubuntu-24.04-arm
    needs: [validation]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Fetch tags
        run: git fetch --tags --force
      - run: git describe --tags

      - name: Install Java 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Install dependencies
        run: sudo apt update && sudo apt install meson libyaml-dev python3-yaml python3-ply python3-jinja2 libssl-dev libudev-dev libegl1-mesa-dev libdrm-dev libgbm-dev

      - name: Set up build
        run: meson setup build

      - name: Build libcamera
        run: meson compile
        working-directory: build

      - run: find
