name: Build driver

on:
  push:
  pull_request:
    branches: ["master"]

jobs:
  validation:
    name: "Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v5

  build:
    runs-on: ubuntu-22.04-arm
    needs: [validation]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Fetch tags
        run: git fetch --tags --force
      - run: git describe --tags

      - name: Install Java 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install libyaml-dev python3-yaml python3-ply python3-jinja2 libssl-dev libudev-dev libegl1-mesa-dev libdrm-dev libgbm-dev
          pip install meson

      - name: Set up build
        run: meson setup meson_build -Dbuildtype=debugoptimized
        env:
          CC: gcc-12
          CXX: g++-12

      - name: Build libcamera
        run: meson compile
        working-directory: meson_build

      - run: find

      - run: ./gradlew build -PArchOverride=linuxarm64
      - run: ./gradlew publish -PArchOverride=linuxarm64
        if: github.event_name == 'push' && github.repository_owner == 'photonvision'
        env:
          ARTIFACTORY_API_KEY: ${{ secrets.ARTIFACTORY_API_KEY }}

      - uses: actions/upload-artifact@v4
        name: Upload jar
        with:
          name: libcamera-jar-pi
          path: ${{ github.workspace }}/build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: libcamera-driver
          path: |
            meson_build/**/*
      - uses: actions/upload-artifact@v4
        with:
          name: libcamera-meme
          path: meson_build/libcamera_meme

      # Push to dev release on pushes to master
      - uses: pyTooling/Actions/releaser@r0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "Dev"
          rm: true
          files: |
            meson_build/**/*.so
        if: github.event_name == 'push'

      # Push to actual release, if tagged
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            meson_build/**/*.so
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

